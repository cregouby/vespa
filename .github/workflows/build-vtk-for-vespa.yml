name: Build VTK for Vespa

on:
  workflow_dispatch:
    inputs:
      vtk_version:
        description: 'VTK version to build'
        required: true
        default: '9.4.1'
        type: string
  push:
    paths:
      - '.github/vtk-version.txt'
      - '.github/workflows/build-vtk-for-vespa.yml'

jobs:
  read-version:
    name: Read VTK version
    runs-on: ubuntu-latest
    outputs:
      vtk_version: ${{ steps.version.outputs.vtk_version }}
      vtk_minor: ${{ steps.version.outputs.vtk_minor }}
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Read version from file
        id: version
        shell: bash
        run: |
          VTK_VERSION=$(cat .github/vtk-version.txt | tr -d '[:space:]')
          VTK_MINOR="${VTK_VERSION%.*}"
          
          echo "vtk_version=${VTK_VERSION}" >> $GITHUB_OUTPUT
          echo "vtk_minor=${VTK_MINOR}" >> $GITHUB_OUTPUT
          echo "VTK version: ${VTK_VERSION}"
          echo "VTK minor: ${VTK_MINOR}"

  build-vtk:
    name: Build VTK (${{ matrix.os }})
    needs: read-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-latest
            platform: darwin-x86_64
            cmake_arch: x86_64
          - os: windows-latest
            platform: windows-x86_64
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential \
            libgl1-mesa-dev libxt-dev libxrender-dev libxext-dev
      
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      
      - name: Set up R and Rtools45 (Windows)
        if: runner.os == 'Windows'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          rtools-version: '45'
      
      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pacman -Sy --noconfirm --needed \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja
          echo "export PATH=/x86_64-w64-mingw32.static.posix/bin:/ucrt64/bin:\$PATH" >> ~/.bash_profile
      
      - name: Download VTK source
        shell: bash
        run: |
          VTK_VERSION="${{ needs.read-version.outputs.vtk_version }}"
          VTK_MINOR="${{ needs.read-version.outputs.vtk_minor }}"
          URL="https://www.vtk.org/files/release/${VTK_MINOR}/VTK-${VTK_VERSION}.tar.gz"
          echo "Downloading $URL"
          curl -fsSL "$URL" -o vtk-src.tar.gz
          tar -xzf vtk-src.tar.gz
      
      - name: Configure VTK (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VTK_VERSION="${{ needs.read-version.outputs.vtk_version }}"
          mkdir -p build install
          cd build
          
          CMAKE_ARCH_FLAG=""
          if [ "${{ matrix.platform }}" = "darwin-x86_64" ]; then
            CMAKE_ARCH_FLAG="-DCMAKE_OSX_ARCHITECTURES=x86_64"
          elif [ "${{ matrix.platform }}" = "darwin-arm64" ]; then
            CMAKE_ARCH_FLAG="-DCMAKE_OSX_ARCHITECTURES=arm64"
          fi
          
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/../install" \
            -DBUILD_SHARED_LIBS=OFF \
            -DVTK_BUILD_ALL_MODULES=OFF \
            -DVTK_MODULE_ENABLE_VTK_IOLegacy=YES \
            -DVTK_MODULE_ENABLE_VTK_IOXML=YES \
            -DVTK_MODULE_ENABLE_VTK_IOGeometry=YES \
            -DVTK_MODULE_ENABLE_VTK_IOCore=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonCore=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonDataModel=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonExecutionModel=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonMath=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonMisc=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonSystem=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonTransforms=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersCore=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersGeneral=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersGeometry=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersModeling=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersExtraction=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersPoints=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersHybrid=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersSources=YES \
            -DVTK_MODULE_ENABLE_VTK_ImagingCore=YES \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            $CMAKE_ARCH_FLAG \
            ../VTK-${VTK_VERSION}
      
      - name: Configure VTK (Windows)
        if: runner.os == 'Windows'
        shell: C:\rtools45\usr\bin\bash.exe --login -eo pipefail {0}
        run: |
          VTK_VERSION="${{ needs.read-version.outputs.vtk_version }}"
          export PATH="/x86_64-w64-mingw32.static.posix/bin:${PATH}"
          TCHAIN=/x86_64-w64-mingw32.static.posix/bin
          export CC="${TCHAIN}/gcc"
          export CXX="${TCHAIN}/g++"
          export AR="${TCHAIN}/ar"
          export RANLIB="${TCHAIN}/ranlib"
          
          # Use GITHUB_WORKSPACE which always points to the workflow working directory
          WORK_DIR="${GITHUB_WORKSPACE}"
          SRC_DIR="${WORK_DIR}/VTK-${VTK_VERSION}"
          BUILD_DIR="${WORK_DIR}/build"
          INSTALL_DIR="${WORK_DIR}/install"
          
          mkdir -p "$BUILD_DIR" "$INSTALL_DIR"
          cd "$BUILD_DIR"
          
          # Convert install path to Windows format for CMake
          INSTALL_PREFIX_WIN="$(cygpath -w "$INSTALL_DIR")"
          
          echo "Source directory: $SRC_DIR"
          echo "Build directory: $BUILD_DIR"
          echo "Install directory: $INSTALL_PREFIX_WIN"
          
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX_WIN}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DVTK_BUILD_ALL_MODULES=OFF \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_FLAGS="-D__USE_MINGW_ANSI_STDIO=1 -D_GNU_SOURCE -Wno-error=incompatible-pointer-types -fcommon" \
            -DCMAKE_CXX_FLAGS="-D__USE_MINGW_ANSI_STDIO=1 -D_GNU_SOURCE" \
            -DVTK_BUILD_ALL_MODULES=OFF -DVTK_BUILD_TESTING=OFF \
            -DVTK_BUILD_EXAMPLES=OFF -DVTK_WRAP_PYTHON=OFF \
            -DVTK_GROUP_ENABLE_Rendering=NO -DVTK_GROUP_ENABLE_Qt=NO \
            -DVTK_GROUP_ENABLE_MPI=NO   -DVTK_GROUP_ENABLE_Web=NO \
            -DVTK_MODULE_ENABLE_VTK_CommonCore=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonDataModel=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonExecutionModel=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersCore=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersExtraction=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersGeometry=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersGeneral=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersModeling=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersPoints=YES \
            -DVTK_MODULE_ENABLE_VTK_IOGeometry=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersHybrid=YES \
            -DVTK_MODULE_ENABLE_VTK_RenderingCore=YES \
            -DVTK_MODULE_ENABLE_VTK_IOXML=YES \
            -DVTK_MODULE_ENABLE_VTK_IOCore=YES \
            -DVTK_MODULE_ENABLE_VTK_IOLegacy=YES \
            -DVTK_MODULE_ENABLE_VTK_ImagingCore=YES \
            -DVTK_MODULE_ENABLE_VTK_ImagingStencil=YES \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            "$SRC_DIR"

      - name: Build and install VTK
        shell: bash
        run: |
          cd build
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake --build . --parallel $(sysctl -n hw.logicalcpu)
          else
            cmake --build . --parallel
          fi
          cmake --install .
      
      - name: Package VTK
        shell: bash
        run: |
          VTK_VERSION="${{ needs.read-version.outputs.vtk_version }}"
          VTK_MINOR="${{ needs.read-version.outputs.vtk_minor }}"
          PKG="vtk-${VTK_VERSION}-vespa-${{ matrix.platform }}"
          mkdir -p "${PKG}"

          # include/vtk-X.Y + lib/*.a + lib/cmake/vtk-X.Y/  (required by find_package)
          cp -R install/include "${PKG}/include"
          cp -R install/lib     "${PKG}/lib"
          [ -d install/share ] && cp -R install/share "${PKG}/share" || true

          test -f "${PKG}/lib/cmake/vtk-${VTK_MINOR}/vtk-config.cmake" || {
            echo "ERREUR: vtk-config.cmake absent de l'arborescence packagée"; exit 1; }

          # Stats without pipe (resilient to SIGPIPE / pipefail)
          set -- "${PKG}"/lib/*.a
          echo ">> $# static archives ; for examples :"
          for a in "$1" "$2" "$3"; do [ -e "$a" ] && echo "   $a"; done

          if [ "${{ runner.os }}" = "Windows" ]; then
            zip -r "${PKG}.zip" "${PKG}"
          else
            tar -czf "${PKG}.tar.gz" "${PKG}"
          fi
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtk-${{ matrix.platform }}
          path: |
            vtk-*-vespa-*.tar.gz
            vtk-*-vespa-*.zip
          retention-days: 7
  
  release:
    name: Create Release
    needs: [build-vtk, read-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # no need for checkout : softprops/action-gh-release uses GITHUB_REPOSITORY
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Verify release completeness (atomic publish)
        shell: bash
        run: |
          VTK_VERSION="${{ needs.read-version.outputs.vtk_version }}"
          MISSING=""
          for p in linux-x86_64 linux-aarch64 darwin-arm64 darwin-x86_64 windows-x86_64; do
            if   [ -s "artifacts/vtk-${p}/vtk-${VTK_VERSION}-vespa-${p}.tar.gz" ]; then
              echo ">> OK  ${p} (tar.gz)"
            elif [ -s "artifacts/vtk-${p}/vtk-${VTK_VERSION}-vespa-${p}.zip" ]; then
              echo ">> OK  ${p} (zip)"
            else
              echo ">> MANQUANT ou vide : ${p}"
              MISSING="${MISSING} ${p}"
            fi
          done
          [ -z "${MISSING}" ] || { echo "ERREUR: release incomplète :${MISSING}"; exit 1; }

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: vtk-for-vespa-${{ needs.read-version.outputs.vtk_version }}
          name: VTK ${{ needs.read-version.outputs.vtk_version }} for Vespa
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
