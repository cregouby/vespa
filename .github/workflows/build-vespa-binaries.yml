name: Build Vespa Binaries (Windows)

on:
  workflow_dispatch:  

jobs:
  build-vespa-windows:
    runs-on: windows-latest

    env:
      CMAKE_GENERATOR: Ninja
      # Force the Rtools static-posix toolchain (same ABI as CRAN R)
      CC: gcc
      CXX: g++
      
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      
      # pacman from Rtools is on PATH after setup-r
      - name: Install dependencies via pacman
        shell: bash
        run: |
          pacman -S --noconfirm --needed \
            mingw-w64-ucrt-x86_64-cgal \
            mingw-w64-ucrt-x86_64-ceres-solver \
            mingw-w64-ucrt-x86_64-eigen3 \
            mingw-w64-ucrt-x86_64-boost \
            mingw-w64-ucrt-x86_64-ninja \
            mingw-w64-ucrt-x86_64-vtk \
            mingw-w64-ucrt-x86_64-nlohmann-json
      
      - name: Build Vespa (static)
        shell: bash
        run: |
          T="${{ runner.temp }}"
          T="${T//\\//}"
          VESPA_TAG="$(cat .github/vespa-version.txt | tr -d '[:space:]')"
          INSTALL_DIR="inst/vespa"
          
          mkdir -p "$INSTALL_DIR"
          
          cmake -S tools/build-vespa -B "$T/vespa-build" \
            -DINSTALL_PREFIX="$PWD/inst/vespa" \
            -DVESPA_GIT_TAG="$VESPA_TAG" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++
          
          cmake --build "$T/vespa-build"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vespa-binaries-windows
          path: inst/vespa/vespa0.1.0-static-posix-x64.zip
          retention-days: 7
