name: Build Vespa Binaries (Windows)

on:
  workflow_dispatch:  

jobs:
  build-vespa-windows:
    runs-on: windows-latest

    env:
      CMAKE_GENERATOR: Ninja
      # Force the Rtools static-posix toolchain (same ABI as CRAN R)
      CC: gcc
      CXX: g++
      INSTALL_DIR: inst/vespa
      
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      
      - name: Read Vespa version
        shell: bash
        run: |
          echo "VESPA_TAG=$(tr -d '[:space:]' < .github/vespa-version.txt)" >> "$GITHUB_ENV"
        
      # pacman from Rtools is on PATH after setup-r
      - name: Install dependencies via pacman
        shell: bash
        run: |
          pacman -S --noconfirm --needed \
            mingw-w64-ucrt-x86_64-cgal \
            mingw-w64-ucrt-x86_64-ceres-solver \
            mingw-w64-ucrt-x86_64-eigen3 \
            mingw-w64-ucrt-x86_64-boost \
            mingw-w64-ucrt-x86_64-ninja \
            mingw-w64-ucrt-x86_64-vtk \
            mingw-w64-ucrt-x86_64-nlohmann-json
      
      - name: Build Vespa (static)
        shell: bash
        run: |
          T="${{ runner.temp }}"
          T="${T//\\//}"
          
          mkdir -p "$INSTALL_DIR"
          
          cmake -S tools/build-vespa -B "$T/vespa-build" \
            -DINSTALL_PREFIX="$PWD/$INSTALL_DIR" \
            -DVESPA_GIT_TAG="$VESPA_TAG" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++

          cmake --build "$T/vespa-build"
      
      - name: Package Vespa
        shell: bash
        run: |
          ZIP_NAME="vespa-${VESPA_TAG}-static-posix-x64.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          ls -R "$INSTALL_DIR"
          (cd "$INSTALL_DIR" && 7z a -tzip "$ZIP_NAME" .)
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vespa-binaries-windows
          path: ${{ env.INSTALL_DIR }}/${{ env.ZIP_NAME }}
          retention-days: 7
