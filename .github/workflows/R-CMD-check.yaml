# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R CMD check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    # Windows is best-effort: VTK/CGAL toolchain is complex under Rtools MinGW
    continue-on-error: ${{ matrix.config.experimental == true }}
    concurrency:
      group: R-CMD-check-${{ matrix.config.os }}-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest }
          - { os: macos-latest }
          - { os: windows-latest, experimental: true }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RGL_USE_NULL: true

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: ${{ runner.os == 'Linux' }}

      # ── System dependencies ──────────────────────────────────────────────────

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcgal-dev libceres-dev cmake ninja-build \
            build-essential libboost-all-dev libeigen3-dev \
            libx11-dev libgl1-mesa-dev libglu1-mesa-dev \
            libvtk9-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cgal ceres-solver vtk ninja
          brew install --cask xquartz
          echo "/opt/X11/bin" >> $GITHUB_PATH
          echo "DISPLAY=:0" >> $GITHUB_ENV

      # pacman from Rtools is on PATH after setup-r
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pacman -S --noconfirm --needed `
            mingw-w64-ucrt-x86_64-cgal `
            mingw-w64-ucrt-x86_64-ceres-solver `
            mingw-w64-ucrt-x86_64-eigen3 `
            mingw-w64-ucrt-x86_64-boost `
            mingw-w64-ucrt-x86_64-ninja `
            mingw-w64-ucrt-x86_64-vtk

      # ── Vespa pre-build into inst/vespa (bundled, Priority 1 in configure) ──
      
      - name: Set VTK root (macOS)
        if: runner.os == 'macOS'
        run: echo "VTK_ROOT=$(brew --prefix vtk)" >> $GITHUB_ENV

      - name: Set compiler env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "VTK_ROOT=C:/rtools45/ucrt64" >> $env:GITHUB_ENV
          echo "CC=gcc" >> $env:GITHUB_ENV
          echo "CXX=g++" >> $env:GITHUB_ENV

      - name: Restore Vespa bundle cache
        id: cache-vespa-bundle
        uses: actions/cache/restore@v6
        with:
          path: inst/vespa
          key: vespa-bundle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/vespa-version.txt') }}

      - name: Build and install Vespa (Linux/macOS)
        if: runner.os != 'Windows' && steps.cache-vespa-bundle.outputs.cache-hit != 'true'
        run: |
          T=$(mktemp -d)
          VESPA_TAG="$(cat .github/vespa-version.txt | tr -d '[:space:]')"
          mkdir -p inst/vespa
          cmake -S tools/build-vespa -B "$T/vespa-build" \
            -DINSTALL_PREFIX="$PWD/inst/vespa" \
            -DVESPA_GIT_TAG="$VESPA_TAG" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$T/vespa-build"

      - name: Build and install Vespa (Windows)
        if: runner.os == 'Windows' && steps.cache-vespa-restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          T="${{ runner.temp }}"
          T="${T//\\//}"
          VESPA_TAG="$(cat .github/vespa-version.txt | tr -d '[:space:]')"
          mkdir -p "${{ matrix.config.vespa-root }}"
          cmake -G Ninja -S tools/build-vespa -B "$T/vespa-build" \
            -DINSTALL_PREFIX="${{ matrix.config.vespa-root }}" \
            -DVESPA_GIT_TAG="$VESPA_TAG" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$T/vespa-build"

      - name: Save Vespa cache
        if: always() && runner.os == 'Windows' && steps.cache-vespa-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.config.vespa-root }}
          key: ${{ steps.cache-vespa-restore.outputs.cache-primary-key }}
            
      # ── R check ─────────────────────────────────────────────────────────────

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages:  |
            any::rcmdcheck
            astamm/rvtk
          needs: check
          
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

