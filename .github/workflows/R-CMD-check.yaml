# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R CMD check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    continue-on-error: ${{ matrix.config.experimental == true }}
    concurrency:
      group: R-CMD-check-${{ matrix.config.os }}-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-24.04 }
          - { os: macos-latest }
          - { os: windows-latest, experimental: true }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RGL_USE_NULL: true

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: ${{ runner.os == 'Linux' }}

      # Only the native dependencies of the bundled Vespa sources are needed.
      # VTK itself is supplied by the 'rvtk' R package (declared in Imports):
      # no prebuilt VTK tarball download and no Vespa superbuild in CI.
      # pacman comes from Rtools and is on PATH after setup-r (Windows).
      # Windows: rtools45 paths are pinned; bump when Rtools versions do.
      - name: Install system dependencies and set toolchain env
        shell: bash
        run: |
          set -e
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                libcgal-dev libceres-dev libeigen3-dev libboost-all-dev \
                libgmp-dev libmpfr-dev
              ;;
            macOS)
              brew install cgal ceres-solver eigen
              ;;
            Windows)
              pacman -S --noconfirm --needed \
                mingw-w64-ucrt-x86_64-cgal \
                mingw-w64-ucrt-x86_64-ceres-solver \
                mingw-w64-ucrt-x86_64-eigen3 \
                mingw-w64-ucrt-x86_64-boost
              echo "CC=C:/rtools45/x86_64-w64-mingw32.static.posix/bin/gcc.exe" >> "$GITHUB_ENV"
              echo "CXX=C:/rtools45/x86_64-w64-mingw32.static.posix/bin/g++.exe" >> "$GITHUB_ENV"
              echo "C:/rtools45/ucrt64/bin" >> "$GITHUB_PATH"
              ;;
          esac

      # Installs 'rvtk' from CRAN along with the other Imports. Its install
      # time configuration resolves VTK (system installation when available,
      # pre-built static libraries otherwise) and 'configure' queries the
      # resulting flags through tools/configure.R.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
